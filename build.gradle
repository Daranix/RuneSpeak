plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex("net\\.runelite.*")
        }
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.runespeak.RuneSpeakPluginTest'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    implementation 'com.microsoft.onnxruntime:onnxruntime:1.17.1'
    implementation('ai.djl.huggingface:tokenizers:0.36.0') {
        exclude group: 'com.microsoft.onnxruntime'
    }

    testImplementation 'junit:junit:4.13.2'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion

    // logback 1.5.x supports SLF4J 2.x (required by tokenizers -> ai.djl -> slf4j-api:2.0.17)
    // Overrides RuneLite's logback 1.2.9 which only supports SLF4J 1.7.x
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.5.13'
}

group = 'com.runespeak'
version = '1.0.0'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

// The packager's init script creates runelitePluginHubPackage as a Copy/Jar task that merges
// runtimeClasspath into a fat jar. Add exclude patterns to keep its output under 10MB by
// stripping native libraries (the ORT Java classes alone are ~500KB — safe to include).
afterEvaluate {
    tasks.matching { it.name == "runelitePluginHubPackage" }.configureEach { task ->
        task.dependsOn shadowJar
        task.duplicatesStrategy = DuplicatesStrategy.EXCLUDE

        task.exclude '**/*.so'
        task.exclude '**/*.dll'
        task.exclude '**/*.dylib'
        task.exclude '**/*.jnilib'
        task.exclude '**/*.dSYM/**'
        task.exclude '**/*.a'
        task.exclude '**/*.pdb'
        task.exclude 'ai/onnxruntime/native/**'
        task.exclude 'native/lib/**'
        task.exclude 'com/sun/jna/**/*.so'
        task.exclude 'com/sun/jna/**/*.dll'
        task.exclude 'com/sun/jna/**/*.dylib'
        task.exclude 'com/sun/jna/**/*.jnilib'
    }
}

tasks.register('shadowJar', Jar) {
    dependsOn configurations.runtimeClasspath
    archiveFileName = "runespeak-${version}.jar"
    manifest {
        attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    exclude 'META-INF/INDEX.LIST'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude '**/module-info.class'

    exclude '**/*.pdb'
    exclude '**/*.dSYM/**'
    exclude '**/*.a'

    exclude '**/*.so'
    exclude '**/*.dll'
    exclude '**/*.dylib'
    exclude '**/*.jnilib'
    exclude 'ai/onnxruntime/native/**'
    exclude 'native/lib/**'
    exclude 'com/sun/jna/**/*.so'
    exclude 'com/sun/jna/**/*.dll'
    exclude 'com/sun/jna/**/*.dylib'
    exclude 'com/sun/jna/**/*.jnilib'
}

tasks.register('runBenchmark', JavaExec) {
    group = 'runespeak'
    description = 'Run translation benchmark across models'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
    mainClass = 'com.runespeak.benchmark.TranslationBenchmark'
    jvmArgs '-ea'
    if (project.hasProperty('cache')) {
        jvmArgs "-Drunespeak.cache=${project.cache}"
    }
}

tasks.register('runRuneLite', JavaExec) {
    group = 'runelite'
    description = 'Run RuneLite with RuneSpeak plugin'
    dependsOn 'classes', 'testClasses'

    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    args '--developer-mode', '--debug'
    jvmArgs '-ea'
    jvmArgs "-Djava.library.path=${configurations.runtimeClasspath.asPath}"
}

test {
}

plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex("net\\.runelite.*")
        }
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.runespeak.RuneSpeakPluginTest'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    testImplementation 'junit:junit:4.13.2'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.runespeak'
version = '1.0.0'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release.set(11)
}
tasks.register('runBenchmark', JavaExec) {
    group = 'runespeak'
    description = 'Run translation benchmark across models'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
    mainClass = 'com.runespeak.benchmark.TranslationBenchmark'
    jvmArgs '-ea'
    if (project.hasProperty('cache')) {
        jvmArgs "-Drunespeak.cache=${project.cache}"
    }
}

tasks.register('runRuneLite', JavaExec) {
    group = 'runelite'
    description = 'Run RuneLite with RuneSpeak plugin'
    dependsOn 'classes', 'testClasses'

    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    args '--developer-mode', '--debug'
    jvmArgs '-ea'
    jvmArgs "-Djava.library.path=${configurations.runtimeClasspath.asPath}"
    // jvmArgs '-Drunespeak.verbose=true'  // uncomment for per-layer/step debug logs
}

test {
    jvmArgs '-Xmx4g'
    jvmArgs '-Dfile.encoding=UTF-8'
}

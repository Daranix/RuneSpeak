plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex("net\\.runelite.*")
        }
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.runespeak.RuneSpeakPluginTest'

// configurations.all {
//     exclude group: 'com.microsoft.onnxruntime', module: 'onnxruntime'
// }

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    implementation 'com.microsoft.onnxruntime:onnxruntime:1.17.1'
    implementation('ai.djl.huggingface:tokenizers:0.36.0') {
        exclude group: 'com.microsoft.onnxruntime'
    }

    testImplementation 'junit:junit:4.13.2'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion

    // logback 1.5.x supports SLF4J 2.x (required by tokenizers -> ai.djl -> slf4j-api:2.0.17)
    // Overrides RuneLite's logback 1.2.9 which only supports SLF4J 1.7.x
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.5.13'
}

group = 'com.runespeak'
version = '1.0.0'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

tasks.configureEach { task ->
    if (task.name == "runelitePluginHubPackage") {
        task.duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

tasks.register('shadowJar', Jar) {
    dependsOn configurations.runtimeClasspath
    archiveFileName = "runespeak-${version}.jar"
    manifest {
        attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    // Strip signature/index files that break fat jars
    exclude 'META-INF/INDEX.LIST'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude '**/module-info.class'

    // Strip debug symbols and static libs (unnecessary at runtime)
    exclude '**/*.pdb'
    exclude '**/*.dSYM/**'
    exclude '**/*.a'

    // Strip ALL native libraries — downloaded at runtime by NativeLibraryManager
    // from Maven Central to support all platforms without bloating the JAR
    exclude '**/*.so'
    exclude '**/*.dll'
    exclude '**/*.dylib'
    exclude 'ai/onnxruntime/native/**'
    exclude 'native/lib/**'
    exclude 'com/sun/jna/**/*.so'
    exclude 'com/sun/jna/**/*.dll'
    exclude 'com/sun/jna/**/*.dylib'
    exclude 'com/sun/jna/**/*.jnilib'
}

tasks.register('runBenchmark', JavaExec) {
    group = 'runespeak'
    description = 'Run translation benchmark across models'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
    mainClass = 'com.runespeak.benchmark.TranslationBenchmark'
    jvmArgs '-ea'
    if (project.hasProperty('cache')) {
        jvmArgs "-Drunespeak.cache=${project.cache}"
    }
}

tasks.register('runRuneLite', JavaExec) {
    group = 'runelite'
    description = 'Run RuneLite with RuneSpeak plugin'
    dependsOn 'classes', 'testClasses'

    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    args '--developer-mode', '--debug'
    jvmArgs '-ea'
    jvmArgs "-Djava.library.path=${configurations.runtimeClasspath.asPath}"
}

test {
}

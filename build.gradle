plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex("net\\.runelite.*")
        }
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.runespeak.RuneSpeakPluginTest'

// configurations.all {
//     exclude group: 'com.microsoft.onnxruntime', module: 'onnxruntime'
// }

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    implementation 'com.microsoft.onnxruntime:onnxruntime:1.17.1'
    implementation('ai.djl.huggingface:tokenizers:0.36.0') {
        exclude group: 'com.microsoft.onnxruntime'
    }

    testImplementation 'junit:junit:4.13.2'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.runespeak'
version = '1.0.0'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('shadowJar', Jar) {
    dependsOn configurations.runtimeClasspath
    archiveFileName = "runespeak-${version}.jar"
    manifest {
        attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    // Strip signature/index files that break fat jars
    exclude 'META-INF/INDEX.LIST'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude '**/module-info.class'

    // Preserve native libraries needed by ORT and DJL
    filesMatching('**/*.so')    { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
    filesMatching('**/*.dll')   { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
    filesMatching('**/*.dylib') { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
}

tasks.register('runBenchmark', JavaExec) {
    group = 'runespeak'
    description = 'Run translation benchmark across models'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
    mainClass = 'com.runespeak.benchmark.TranslationBenchmark'
    jvmArgs '-ea'
    if (project.hasProperty('cache')) {
        jvmArgs "-Drunespeak.cache=${project.cache}"
    }
}

tasks.register('runRuneLite', JavaExec) {
    group = 'runelite'
    description = 'Run RuneLite with RuneSpeak plugin'
    dependsOn 'classes', 'testClasses'

    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    args '--developer-mode', '--debug'
    jvmArgs '-ea'
    jvmArgs "-Djava.library.path=${configurations.runtimeClasspath.asPath}"
}

test {
}

plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    implementation 'ai.djl:api:0.31.0'
    implementation 'ai.djl.huggingface:tokenizers:0.31.0'
    implementation 'ai.djl.huggingface:transformers:0.31.0'
    implementation 'ai.djl.pytorch:pytorch-engine:0.31.0'
    implementation 'ai.djl.pytorch:pytorch-jni:0.31.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.runespeak'
version = '1.0.0'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

task copyResources(type: Copy) {
    from 'src/main/resources'
    into "${buildDir}/resources/main"
}

processResources.dependsOn copyResources
